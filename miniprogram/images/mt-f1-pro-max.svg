<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- 按 F1 Max 机身比例放大，与 F1 PRO / F1 Max 卡片视觉一致 -->
  <g transform="translate(100, 70) scale(1.85) translate(-50, -37.5)">
    <defs>
      <clipPath id="f1-pro-max-body-clip">
        <rect x="5" y="10" width="90" height="55" rx="10" />
      </clipPath>
    </defs>
    <rect x="8" y="13" width="90" height="55" rx="10" fill="#e5e5ea" />
    <g clip-path="url(#f1-pro-max-body-clip)">
      <rect x="5" y="10" width="90" height="55" rx="10" fill="#ffffff" />
      <polygon points="65,5 110,5 110,75 35,75" fill="#1c1c1e" />
    </g>
    <rect x="5" y="10" width="90" height="55" rx="10" fill="none" stroke="#1c1c1e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
    <rect x="20" y="20" width="16" height="5" rx="2.5" fill="#1c1c1e" />
    <rect x="64" y="20" width="16" height="5" rx="2.5" fill="#ffffff" />
    <text x="50" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22px" letter-spacing="2px" fill="#1c1c1e" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">MT</text>
  </g>
</svg>
